name: Jellyfin 12 CI

on:
  push:
    branches: [master]
    paths-ignore:
      - manifest.json
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_VERSION: 13.0.1.0

jobs:
  build:
    name: Build Jellyfin ${{ matrix.jellyfin }} plugin
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jellyfin: [12.0.0, 12.1.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Jellyfin.Plugin.Kinopoisk.sln -p:JellyfinVersion=${{ matrix.jellyfin }}

      - name: Build
        run: dotnet build src/Jellyfin.Plugin.Kinopoisk.sln --configuration Release --no-restore -p:JellyfinVersion=${{ matrix.jellyfin }}

      - name: Test
        run: dotnet test src/Jellyfin.Plugin.Kinopoisk.Tests/Jellyfin.Plugin.Kinopoisk.Tests.csproj --configuration Release --no-build -p:JellyfinVersion=${{ matrix.jellyfin }}

      - name: Validate manifest and metadata
        run: |
          jq empty manifest.json
          jq empty meta.json
          test "$(jq -r '.framework' meta.json)" = "net10.0"

      - name: Package plugin
        run: |
          VERSION="${PLUGIN_VERSION}"
          TARGET_ABI="${{ matrix.jellyfin }}.0"
          mkdir -p release_package
          cp "src/Jellyfin.Plugin.Kinopoisk/bin/Release/net10.0/Jellyfin.Plugin.Kinopoisk.dll" release_package/
          cp "src/KinopoiskUnofficialInfo.ApiClient/bin/Release/net10.0/KinopoiskUnofficialInfo.ApiClient.dll" release_package/
          jq --arg version "$VERSION" --arg targetAbi "$TARGET_ABI" \
            '.version = $version | .targetAbi = $targetAbi' meta.json > release_package/meta.json
          (cd release_package && zip -r "../jellyfin-plugin-kinopoisk_v${VERSION}.zip" .)

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinopoisk-${{ matrix.jellyfin }}
          path: jellyfin-plugin-kinopoisk_v${{ matrix.jellyfin }}.zip
          if-no-files-found: error

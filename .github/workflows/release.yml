name: Build and Release Kinopoisk Plugin

on:
  push:
    branches: [master]
    paths-ignore:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Jellyfin ${{ matrix.jellyfin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jellyfin: [12.0.0, 12.1.0]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/Jellyfin.Plugin.Kinopoisk.sln -p:JellyfinVersion=${{ matrix.jellyfin }}

      - name: Build solution
        run: dotnet build src/Jellyfin.Plugin.Kinopoisk.sln --configuration Release --no-restore -p:JellyfinVersion=${{ matrix.jellyfin }}

      - name: Run tests
        run: dotnet test src/Jellyfin.Plugin.Kinopoisk.Tests/Jellyfin.Plugin.Kinopoisk.Tests.csproj --configuration Release --no-build -p:JellyfinVersion=${{ matrix.jellyfin }}

      - name: Package plugin
        run: |
          set -euo pipefail
          VERSION="13.0.0.0"
          TARGET_ABI="${{ matrix.jellyfin }}.0"
          ZIP="jellyfin-plugin-kinopoisk_v${VERSION}_jf${{ matrix.jellyfin }}.zip"

          mkdir -p release_package
          cp "src/Jellyfin.Plugin.Kinopoisk/bin/Release/net10.0/Jellyfin.Plugin.Kinopoisk.dll" release_package/
          cp "src/KinopoiskUnofficialInfo.ApiClient/bin/Release/net10.0/KinopoiskUnofficialInfo.ApiClient.dll" release_package/

          jq --arg version "$VERSION" --arg targetAbi "$TARGET_ABI" \
            '.version = $version | .targetAbi = $targetAbi' meta.json > release_package/meta.json

          (cd release_package && zip -r "../$ZIP" .)
          md5sum "$ZIP" | awk '{print toupper($1)}' > "$ZIP.md5"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.jellyfin }}
          path: |
            jellyfin-plugin-kinopoisk_v13.0.0.0_jf${{ matrix.jellyfin }}.zip
            jellyfin-plugin-kinopoisk_v13.0.0.0_jf${{ matrix.jellyfin }}.zip.md5
          if-no-files-found: error

  publish:
    name: Publish release and repository manifest
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Jellyfin 12.0 artifact
        uses: actions/download-artifact@v4
        with:
          name: release-12.0.0
          path: releases/12.0.0

      - name: Download Jellyfin 12.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: release-12.1.0
          path: releases/12.1.0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v13.0.0.0"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "КиноПоиск 13.0.0.0" \
              --notes "Jellyfin 12.0 and 12.1 compatibility build. Plugin versioning is independent from the Jellyfin ABI version."

          gh release upload "$TAG" \
            releases/12.0.0/jellyfin-plugin-kinopoisk_v13.0.0.0_jf12.0.0.zip \
            releases/12.1.0/jellyfin-plugin-kinopoisk_v13.0.0.0_jf12.1.0.zip \
            --clobber

      - name: Replace repository manifest with current release only
        run: |
          set -euo pipefail
          CHECKSUM_120=$(cat releases/12.0.0/jellyfin-plugin-kinopoisk_v13.0.0.0_jf12.0.0.zip.md5)
          CHECKSUM_121=$(cat releases/12.1.0/jellyfin-plugin-kinopoisk_v13.0.0.0_jf12.1.0.zip.md5)
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          jq -n \
            --arg checksum120 "$CHECKSUM_120" \
            --arg checksum121 "$CHECKSUM_121" \
            --arg timestamp "$TIMESTAMP" \
            --arg owner "maestronix" \
            --arg imageUrl "https://kinopoisk.userecho.com/s/attachments/28876/0/1/25f8c0315e6ccb2aa6c2642e48f2c9e9.png" \
            '[{
              category: "Metadata",
              guid: "33e6d249-648f-44cd-a9ce-497be06c08df",
              name: "КиноПоиск",
              overview: "Информация о фильмах и сериалах с КиноПоиска",
              owner: $owner,
              description: "Загружает рейтинг, описания, актёров, трейлеры и другие метаданные с КиноПоиска. Для точного распознавания рекомендуется указывать id фильма в имени файла или папки в формате kp-12345 или kp12345.",
              imageUrl: $imageUrl,
              versions: [
                {
                  version: "13.0.0.0",
                  changelog: "Jellyfin 12.0 compatibility; fixed Jellyfin 12 provider discovery and Identify handling; .NET 10.",
                  targetAbi: "12.0.0.0",
                  sourceUrl: "https://github.com/maestronix/jellyfin-plugin-kinopoisk/releases/download/v13.0.0.0/jellyfin-plugin-kinopoisk_v13.0.0.0_jf12.0.0.zip",
                  checksum: $checksum120,
                  timestamp: $timestamp
                },
                {
                  version: "13.0.0.0",
                  changelog: "Jellyfin 12.1 compatibility; fixed Jellyfin 12 provider discovery and Identify handling; .NET 10.",
                  targetAbi: "12.1.0.0",
                  sourceUrl: "https://github.com/maestronix/jellyfin-plugin-kinopoisk/releases/download/v13.0.0.0/jellyfin-plugin-kinopoisk_v13.0.0.0_jf12.1.0.zip",
                  checksum: $checksum121,
                  timestamp: $timestamp
                }
              ]
            }]' > manifest.json

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "Publish Kinopoisk 13.0.0.0 manifest"
          git push

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.0"
        required: false
        default: "1.0.0"
        type: string
      allow_overwrite:
        description: "Allow replacing an unpublished/broken release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  DIST_ARCHIVES_PATH: dist/kinopoisk
  MANIFEST_FILE: dist/manifest.json
  TARGET_ABI: 12.0.0.0

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -E '^## \\[v?[^]]+\\]' CHANGELOG.md | head -1 | sed -E 's/^## \\[v?([^]]+)\\].*/\\1/')"
          fi

          # Normalize accidental whitespace/punctuation from manual workflow input.
          VERSION="$(printf '%s' "$VERSION" | xargs)"
          VERSION="${VERSION%.}"

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine a release version."
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not valid semver X.Y.Z."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match release version $VERSION."
            exit 1
          fi

      - name: Refuse to re-release an existing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "${{ inputs.allow_overwrite }}" = "true" ]; then
              echo "::warning::Release v${VERSION} already exists and will be replaced."
            else
              echo "::error::Release v${VERSION} already exists. Bump the plugin version instead."
              exit 1
            fi
          fi

      - name: Extract changelog
        id: changelog
        run: |
          LINE_NUM=$(grep -n -E "^## \\[v?${VERSION}\\]" CHANGELOG.md | head -1 | cut -d: -f1)

          if [ -n "$LINE_NUM" ]; then
            NEXT_HEADER_LINE=$(tail -n +$((LINE_NUM + 1)) CHANGELOG.md | grep -n -E "^## \\[" | head -1 | cut -d: -f1)
            if [ -n "$NEXT_HEADER_LINE" ]; then
              CHANGELOG=$(tail -n +$((LINE_NUM + 1)) CHANGELOG.md | head -n $((NEXT_HEADER_LINE - 1)))
            else
              CHANGELOG=$(tail -n +$((LINE_NUM + 1)) CHANGELOG.md)
            fi
          else
            CHANGELOG="New release"
          fi

          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build project
        run: dotnet build ./src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj --configuration Release --property:Version="$VERSION"

      - name: Package release archive
        run: |
          RELEASE_FILENAME="jellyfin-plugin-kinopoisk_${VERSION}.zip"
          RELEASE_FILE="${DIST_ARCHIVES_PATH}/${RELEASE_FILENAME}"
          mkdir -p "${DIST_ARCHIVES_PATH}"

          zip --junk-paths "${RELEASE_FILE}" \
            ./src/Jellyfin.Plugin.Kinopoisk/bin/Release/net10.0/Jellyfin.Plugin.Kinopoisk.dll \
            ./src/KinopoiskUnofficialInfo.ApiClient/bin/Release/net10.0/KinopoiskUnofficialInfo.ApiClient.dll

          echo "RELEASE_FILENAME=$RELEASE_FILENAME" >> "$GITHUB_ENV"
          echo "RELEASE_FILE=$RELEASE_FILE" >> "$GITHUB_ENV"

      - name: Calculate checksum
        id: checksum
        run: |
          HASH=$(md5sum "$RELEASE_FILE" | cut -d' ' -f1)
          echo "HASH=$HASH" >> "$GITHUB_ENV"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: ${{ env.RELEASE_FILE }}

      - name: Update plugin manifest
        run: |
          CHANGELOG_JSON=$(echo -n "${{ steps.changelog.outputs.changelog }}" | jq -Rs .)
          SOURCE_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/v${VERSION}/${RELEASE_FILENAME}"

          jq --arg version "$VERSION" \
             --arg checksum "$HASH" \
             --argjson changelog "$CHANGELOG_JSON" \
             --arg targetAbi "$TARGET_ABI" \
             --arg timestamp "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
             --arg sourceUrl "$SOURCE_URL" \
             '.[0].versions = [
               {
                 "version": $version,
                 "checksum": $checksum,
                 "changelog": $changelog,
                 "targetAbi": $targetAbi,
                 "sourceUrl": $sourceUrl,
                 "timestamp": $timestamp
               }
             ] + (.[0].versions | map(select(.version != $version)))' \
             "$MANIFEST_FILE" > "$MANIFEST_FILE.tmp"

          mv "$MANIFEST_FILE.tmp" "$MANIFEST_FILE"

      - name: Commit manifest
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git fetch origin master
          git checkout master

          git add "$MANIFEST_FILE"
          if git diff --cached --quiet; then
            echo "No manifest changes."
            exit 0
          fi

          git commit -m "Update plugin manifest for v${VERSION} [skip ci]"
          git push origin master

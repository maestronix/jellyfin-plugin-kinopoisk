name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj

      - name: Build
        run: dotnet build ./src/Jellyfin.Plugin.Kinopoisk/Jellyfin.Plugin.Kinopoisk.csproj --configuration Release --no-restore -p:Version=1.0.0

      - name: Verify fork changes
        run: |
          if grep -R --line-number "IExternalSearchProvider" ./src/Jellyfin.Plugin.Kinopoisk --include='*.cs'; then
            echo "::error::Kinopoisk must not register a global Jellyfin search provider."
            exit 1
          fi

          if grep -nE 'STL1te|LinFor' ./dist/manifest.json; then
            echo "::error::Plugin manifest still references the upstream repository."
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p artifacts
          zip -j artifacts/jellyfin-plugin-kinopoisk_1.0.0.zip \
            ./src/Jellyfin.Plugin.Kinopoisk/bin/Release/net10.0/Jellyfin.Plugin.Kinopoisk.dll \
            ./src/KinopoiskUnofficialInfo.ApiClient/bin/Release/net10.0/KinopoiskUnofficialInfo.ApiClient.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: jellyfin-plugin-kinopoisk-1.0.0
          path: artifacts/jellyfin-plugin-kinopoisk_1.0.0.zip
